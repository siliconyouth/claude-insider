name: E2E Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  # Allow manual trigger
  workflow_dispatch:
    inputs:
      browser:
        description: 'Browser to test'
        required: false
        default: 'chromium'
        type: choice
        options:
          - chromium
          - firefox
          - webkit
          - all

# Cancel in-progress runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  NODE_ENV: test

jobs:
  # ==========================================================================
  # Install & Cache Dependencies
  # ==========================================================================
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: cd apps/web && npx playwright install --with-deps

      - name: Install Playwright system deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: cd apps/web && npx playwright install-deps

      - name: Build all packages (Turborepo)
        run: pnpm build
        env:
          NEXT_PUBLIC_APP_URL: http://localhost:3001
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-key' }}
          # Skip database-dependent operations during build
          SKIP_ENV_VALIDATION: true

      - name: Cache build outputs
        uses: actions/cache/save@v4
        with:
          path: |
            apps/web/.next
            packages/ui/dist
          key: ${{ runner.os }}-build-${{ github.sha }}

  # ==========================================================================
  # Anonymous Tests (No Auth Required)
  # ==========================================================================
  test-anonymous:
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2]
        shardTotal: [2]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore build cache
        uses: actions/cache/restore@v4
        with:
          path: |
            apps/web/.next
            packages/ui/dist
          key: ${{ runner.os }}-build-${{ github.sha }}

      - name: Restore Playwright cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install Playwright deps
        run: cd apps/web && npx playwright install-deps

      - name: Run anonymous E2E tests
        run: |
          cd apps/web
          npx playwright test --project=anonymous --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
        env:
          # Add minimal env vars for tests
          NEXT_PUBLIC_APP_URL: http://localhost:3001
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-key' }}

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-anonymous-${{ matrix.shardIndex }}
          path: apps/web/tests/e2e/test-results/
          retention-days: 7

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-anonymous-${{ matrix.shardIndex }}
          path: apps/web/tests/e2e/playwright-report/
          retention-days: 7

  # ==========================================================================
  # Chromium Tests (Primary Browser)
  # ==========================================================================
  test-chromium:
    needs: setup
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.browser == 'chromium' || github.event.inputs.browser == 'all'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore build cache
        uses: actions/cache/restore@v4
        with:
          path: |
            apps/web/.next
            packages/ui/dist
          key: ${{ runner.os }}-build-${{ github.sha }}

      - name: Restore Playwright cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install Playwright deps
        run: cd apps/web && npx playwright install-deps chromium

      - name: Run Chromium E2E tests
        run: |
          cd apps/web
          npx playwright test --project=chromium
        env:
          NEXT_PUBLIC_APP_URL: http://localhost:3001
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-key' }}
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-chromium
          path: apps/web/tests/e2e/test-results/
          retention-days: 7

  # ==========================================================================
  # Firefox Tests
  # ==========================================================================
  test-firefox:
    needs: setup
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.browser == 'firefox' || github.event.inputs.browser == 'all'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore build cache
        uses: actions/cache/restore@v4
        with:
          path: |
            apps/web/.next
            packages/ui/dist
          key: ${{ runner.os }}-build-${{ github.sha }}

      - name: Restore Playwright cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install Playwright deps
        run: cd apps/web && npx playwright install-deps firefox

      - name: Run Firefox E2E tests
        run: |
          cd apps/web
          npx playwright test --project=firefox
        env:
          NEXT_PUBLIC_APP_URL: http://localhost:3001
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-key' }}

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-firefox
          path: apps/web/tests/e2e/test-results/
          retention-days: 7

  # ==========================================================================
  # WebKit Tests
  # ==========================================================================
  test-webkit:
    needs: setup
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.browser == 'webkit' || github.event.inputs.browser == 'all'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore build cache
        uses: actions/cache/restore@v4
        with:
          path: |
            apps/web/.next
            packages/ui/dist
          key: ${{ runner.os }}-build-${{ github.sha }}

      - name: Restore Playwright cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install Playwright deps
        run: cd apps/web && npx playwright install-deps webkit

      - name: Run WebKit E2E tests
        run: |
          cd apps/web
          npx playwright test --project=webkit
        env:
          NEXT_PUBLIC_APP_URL: http://localhost:3001
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-key' }}

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-webkit
          path: apps/web/tests/e2e/test-results/
          retention-days: 7

  # ==========================================================================
  # Merge Reports
  # ==========================================================================
  merge-reports:
    needs: [test-anonymous, test-chromium]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-reports

      - name: Merge test reports
        run: |
          mkdir -p merged-report
          # Simple merge: combine all HTML reports
          find all-reports -name "*.html" -exec cp {} merged-report/ \;
          find all-reports -name "*.png" -exec cp {} merged-report/ \; 2>/dev/null || true

      - name: Upload merged report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-merged
          path: merged-report/
          retention-days: 30
