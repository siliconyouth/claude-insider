<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a"/>
      <stop offset="100%" style="stop-color:#1a1a1a"/>
    </linearGradient>

    <!-- Accent gradient -->
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3B82F6"/>
      <stop offset="100%" style="stop-color:#06B6D4"/>
    </linearGradient>

    <!-- Glow filter -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="20" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgGradient)"/>

  <!-- Decorative circles -->
  <circle cx="100" cy="100" r="200" fill="#3B82F6" opacity="0.1" filter="url(#glow)"/>
  <circle cx="1100" cy="530" r="150" fill="#06B6D4" opacity="0.1" filter="url(#glow)"/>

  <!-- Grid pattern -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="white" stroke-opacity="0.03" stroke-width="1"/>
  </pattern>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- Top accent line -->
  <rect x="0" y="0" width="100%" height="4" fill="url(#accentGradient)"/>

  <!-- Icon circle -->
  <circle cx="600" cy="200" r="60" fill="url(#accentGradient)" opacity="0.2"/>
  <text x="600" y="220" font-family="system-ui, -apple-system, sans-serif" font-size="48" text-anchor="middle" fill="white">🛠️</text>

  <!-- Title -->
  <text x="600" y="340" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="700" text-anchor="middle" fill="white">MCP X Community</text>

  <!-- Category badge -->
  <rect x="500" y="380" width="200" height="36" rx="18" fill="url(#accentGradient)" opacity="0.3"/>
  <text x="600" y="405" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" text-anchor="middle" fill="white" opacity="0.9">TOOLS</text>

  <!-- Domain -->
  <text x="600" y="470" font-family="system-ui, -apple-system, sans-serif" font-size="18" text-anchor="middle" fill="white" opacity="0.5">x.com</text>

  <!-- Claude Insider branding -->
  <text x="600" y="580" font-family="system-ui, -apple-system, sans-serif" font-size="14" text-anchor="middle" fill="white" opacity="0.3">Claude Insider</text>
</svg>